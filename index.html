<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clipper</title><style>body{background:#080b11;color:#e8ebf0;font:16px system-ui,sans-serif;display:grid;place-items:center;height:100vh;margin:0;text-align:center}
a{color:#ff3c4a;font-weight:700}small{color:#7f8b9c}</style></head><body><div><h2>Opening Clipper…</h2><p id="m"><small>finding the laptop</small></p></div>
<script>
fetch('link.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(d=>{
  document.getElementById('m').innerHTML='<a href="'+d.url+'">Tap here if it doesn't open</a><br><small>link updated '+new Date(d.at*1000).toLocaleString()+'</small>';
  location.replace(d.url);
}).catch(()=>{document.getElementById('m').innerHTML='<small>Couldn't reach the link. If Clipper just restarted, wait a minute and refresh.</small>'});
</script></body></html>
